# GitHub Pages preview: static build (nuxt generate) served from https://jwjmason1986-del.github.io/medirefined/
# Requires Settings → Pages → Build and deployment → Source = "GitHub Actions".
# The full site (booking form emails via SMTP) runs on Coolify from Dockerfile.prod; on Pages the form hands off to
# WhatsApp. The Pages copy stays noindex (NUXT_PUBLIC_SITE_INDEXABLE unset) so it never competes with the real domain.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Generate static site
        run: pnpm generate
        env:
          NUXT_APP_BASE_URL: /medirefined/
          NUXT_SITE_URL: https://jwjmason1986-del.github.io # origin only; the path comes from NUXT_APP_BASE_URL
          NUXT_PUBLIC_STATIC_SITE: 'true'
          NITRO_PRESET: github_pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
